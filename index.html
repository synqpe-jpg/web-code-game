    <!-- Typography: Inter (Chuẩn Giao Diện Quốc Tế & Tiếng Việt Tối Ưu) & JetBrains Mono -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        color-scheme: dark;
        background-color: #0B0D19;
      }
      html {
        background-color: #0B0D19 !important;
        color-scheme: dark;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
      }
      body {
        background-color: #0B0D19 !important;
        color: #F8FAFC;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
      }
      #app-preloader {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background: #0B0D19 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        z-index: 9999999 !important;
        gap: 16px !important;
        opacity: 1;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      .loader-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 170px;
        height: 170px;
        border-radius: 50%;
        background-color: transparent;
      }
      .loader {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background-color: transparent;
        animation: loader-rotate 2s linear infinite;
        z-index: 0;
      }
      @keyframes loader-rotate {
        0% { transform: rotate(90deg); box-shadow: 0 10px 20px 0 #fff inset, 0 20px 30px 0 #ad5fff inset, 0 60px 60px 0 #471eec inset; }
        50% { transform: rotate(270deg); box-shadow: 0 10px 20px 0 #fff inset, 0 20px 10px 0 #d60a47 inset, 0 40px 60px 0 #311e80 inset; }
        100% { transform: rotate(450deg); box-shadow: 0 10px 20px 0 #fff inset, 0 20px 30px 0 #ad5fff inset, 0 60px 60px 0 #471eec inset; }
      }
      .loader-center-avatar {
        position: relative;
        z-index: 2;
        width: 102px;
        height: 102px;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 24px rgba(173, 95, 255, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.6);
        background: #0b0d19;
      }
      .loader-center-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }
      .loader-letter {
        display: inline-block;
        opacity: 0.4;
        animation: loader-letter-anim 2s infinite;
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: #fff;
        font-size: 14px;
      }
      @keyframes loader-letter-anim {
        0%, 100% { opacity: 0.4; transform: translateY(0); }
        20% { opacity: 1; transform: scale(1.15); }
        40% { opacity: 0.7; transform: translateY(0); }
      }
    </style>
  </head>
  <body class="bg-background text-foreground min-h-screen font-sans antialiased selection:bg-primary selection:text-white w-full max-w-full relative">
    <!-- Persistent Splash Preloader Overlay covering entire screen until React hydrates -->
    <div id="app-preloader">
      <div class="loader-wrapper">
        <div class="loader"></div>
        <div class="loader-center-avatar">
          <img
            src="/logo.png"
            alt="Code Game Logo"
            width="102"
            height="102"
            fetchpriority="high"
            loading="eager"
            decoding="async"
            onerror="this.onerror=null;this.src='/brand_loader_logo.jpg';"
          />
        </div>
      </div>
      <div style="display:flex;gap:4px;">
        <span class="loader-letter" style="animation-delay:0s">C</span>
        <span class="loader-letter" style="animation-delay:0.1s">O</span>
        <span class="loader-letter" style="animation-delay:0.2s">D</span>
        <span class="loader-letter" style="animation-delay:0.3s">E</span>
        <span class="loader-letter" style="animation-delay:0.4s">&nbsp;</span>
        <span class="loader-letter" style="animation-delay:0.5s">G</span>
        <span class="loader-letter" style="animation-delay:0.6s">A</span>
        <span class="loader-letter" style="animation-delay:0.7s">M</span>
        <span class="loader-letter" style="animation-delay:0.8s">E</span>
      </div>
    </div>

    <div id="root"></div>
    <script>
      (function() {
        var timer = setTimeout(function() {
          var p = document.getElementById('app-preloader');
          if (p) {
            p.style.opacity = '0';
            p.style.pointerEvents = 'none';
            setTimeout(function() { if (p.parentNode) p.parentNode.removeChild(p); }, 360);
          }
        }, 2200);
        window.addEventListener('load', function() {
          setTimeout(function() {
            var p = document.getElementById('app-preloader');
            if (p) {
              p.style.opacity = '0';
              p.style.pointerEvents = 'none';
              setTimeout(function() { if (p.parentNode) p.parentNode.removeChild(p); }, 360);
            }
          }, 600);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
